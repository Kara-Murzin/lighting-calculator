name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Verify production bundle (no raw TypeScript entry)
        run: |
          test -f dist/index.html
          grep -q "/lighting-calculator/assets/" dist/index.html || (
            echo "::error::dist/index.html missing hashed JS/CSS under /lighting-calculator/"
            cat dist/index.html
            exit 1
          )
          if grep -q 'src/main.tsx' dist/index.html; then
            echo "::error::dist/index.html still references src/main.tsx — build misconfigured"
            exit 1
          fi

      - name: Publish dist to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
